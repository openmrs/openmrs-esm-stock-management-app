name: OpenMRS CI

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release version bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      custom_version:
        description: 'Custom version (e.g. 12.5.0). If set, overrides the version bump above.'
        required: false
      publish_only:
        description: 'Re-Publish only (For recovering from a failed npm publish. Skips the version bump, commit, and tag. Set "Custom version" to the existing release version, e.g. 12.4.0.)'
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/build-frontend-module.yml@main

  release:
    needs: build
    permissions:
      contents: write
      id-token: write
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/release-frontend-module.yml@main
    with:
      release_type: ${{ inputs.release_type }}
      release_version: ${{ inputs.custom_version }}
      publish_only: ${{ inputs.publish_only || false }}
      publish_environment: npm-publish
    secrets:
      BOT_PAT: ${{ secrets.OMRS_BOT_GH_TOKEN }}

  stock-expiry-timezone-tests:
    name: Stock expiry timezone regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test expiry dates across timezones
        shell: bash
        run: |
          set -euo pipefail
          for timezone in UTC Asia/Karachi America/New_York America/Los_Angeles Pacific/Auckland; do
            echo "::group::Timezone: $timezone"
            TZ="$timezone" yarn vitest run src/stock-operations/expiry-date.utils.test.ts
            echo "::endgroup::"
          done
